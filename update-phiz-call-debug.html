<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Update Phiz Call Project - Debug</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .log {
            background: #333;
            color: #0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover { background: #1a9d3a; }
        button.secondary { background: #666; }
        button.secondary:hover { background: #555; }
    </style>
</head>
<body>
    <h1>📞 Phiz Call 项目数据更新工具</h1>

    <div class="section">
        <h2>操作</h2>
        <button onclick="updateProject()">更新项目</button>
        <button class="secondary" onclick="checkLocalStorage()">检查localStorage</button>
        <button class="secondary" onclick="clearData()">清空localStorage（重置）</button>
    </div>

    <div class="section">
        <h2>日志</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        const logDiv = document.getElementById('log');

        function log(message) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function checkLocalStorage() {
            log('--- 检查 localStorage ---');
            const saved = localStorage.getItem('pmPortfolioProjects');

            if (!saved) {
                log('❌ 未找到 pmPortfolioProjects 数据');
                return;
            }

            log(`✅ 找到数据，大小: ${saved.length} 字符`);

            try {
                const projects = JSON.parse(saved);
                log(`✅ 解析成功，项目数: ${projects.length}`);

                projects.forEach((p, i) => {
                    log(`  项目 ${i}: "${p.name}"`);
                    if (p.name.includes('Phiz Call')) {
                        log(`    -> painPoints 前50字符: "${p.painPoints.substring(0, 50)}..."`);
                    }
                });
            } catch (e) {
                log(`❌ 解析失败: ${e.message}`);
            }
        }

        function updateProject() {
            log('--- 开始更新 ---');

            // 从localStorage加载现有项目
            const saved = localStorage.getItem('pmPortfolioProjects');
            if (!saved) {
                log('❌ 未找到 pmPortfolioProjects 数据');
                log('💡 请先在浏览器中打开 index.html，让页面初始化');
                alert('未找到项目数据，请先打开 index.html 页面');
                return;
            }

            const projects = JSON.parse(saved);
            log(`✅ 加载了 ${projects.length} 个项目`);

            // 新的Phiz Call项目数据
            const newPhizCall = {
                name: "Phiz Call 音视频通话",
                tagline: "社交场景的有温度通话工具",
                role: "产品经理",
                description: "Phiz Call是一款聚焦社交场景的音视频通话工具，通过解决巴西用户网络异常痛点、拓展社交关系链、提供情感化设计体验，为用户的情感维系、朋友聚会、兴趣协作等社交场景提供稳定、便捷、有趣的实时沟通服务。我负责音视频通话功能的产品设计，包括1v1/群组通话、屏幕共享等核心功能。产品基于真实用户研究（20+访谈），针对4大社交圈层（核心社交圈、扩展社交圈、轻社交圈、同好社交圈）和4大场景（情感维系、内容互动、信息协调、群组社交）进行深度优化。",
                stats: "4大用户圈层, 4大核心场景, 20+用户访谈, 85%内测满意度",
                painPoints: `收不到推送通知：app在后台或者关闭状态下，收不到来电推送，无法直接接听
网络异常痛点：通话突然断开，不知道是网络问题还是对方挂断，情感交流被打断，产生焦虑
基础体验较差：通话整体流程和细节体验与成熟产品存在差距，通话状态变更，快捷回复，通话结束场景等细节考虑不足
社交关系链拓展困难：想邀请朋友加入通话但不在群里，需要逐个私聊邀请，操作繁琐`,
                personas: `核心社交圈（主要）
扩展社交圈（次要）
轻社交圈（扩展）
同好社交圈（扩展）`,
                userJourney: `情感维系场景（Ana异地睡前视频）：晚上10点习惯性检查手机→整理背景调整光线→点击视频通话等待接听→分享今天的事以及情感交流→互道晚安带着满足感入睡（痛点：通话异常结束）
朋友聚会讨论（Lucas组织朋友群）：计划周末聚会需要协调→在朋友群群组通话→讨论时间地点投票决定→确认计划分享到群里（痛点：通话不稳定）
临时问事协调（Mariana确认信息）：需要确认信息想到对方→直接拨打等待接听→询问问题得到答案→挂断（痛点：未能及时收到来电）
学习小组讨论（Julia设计小组）：准备学习讨论整理议题→在学习群群组通话→分享屏幕讨论作业→记录不完整需要手动记录（痛点：屏幕共享看不清，邀请更多成员加入步骤繁琐）`,
                userStories: `作为核心社交圈用户（Ana），我想要网络断开预警和智能重连，以便避免情感交流突然中断的焦虑，保持通话连续性
作为扩展社交圈用户（Lucas），我想要群通话便捷，快速的组织群通话
作为轻社交圈用户（Mariana），我想要及时收到来电，通话稳定进行
作为同好社交圈用户（Julia），我想要群组互动便捷，能够邀请群外成员和进行通话链接分享，以便快速组织朋友聚会，拓展社交关系链`,
                features: `基础通话体验：1V1,1VN,群组音视频通话，屏幕共享等互动功能。呼叫状态流转提示，发言者高亮，快捷回复，留言功能等体验优化
网络异常兜底：智能重连、弱网降级（自动降低画质/切音频）、明确提示原因（网络问题vs对方挂断）等
通知系统优化：多通道推送保障（FCM+三星+APNs），确保不错过重要来电
性能优化：推送通道优化、低端机型编解码优化、长时间通话电池优化
社交关系链拓展：通话中邀请群外成员、临时邀请链接、通话链接社交分享、全选成员一键呼叫，降低社交组织成本`,
                architecture: `Phiz Call采用分层架构，聚焦社交场景通话体验：

【用户体验层】
通话前体验：来电意图显示、预约通话、灵活回复模式、在线状态显示、虚拟背景准备
通话中体验：网络断开预警、智能重连、弱网降级、网络状态可视化、高质量屏幕共享、实时标注
通话后体验：通话结束原因提示、一键重拨、通话留言、AI通话摘要、待办事项提取、精彩瞬间切片

【触达层】
多级推送：长连接+FCM+OEM厂商通道多级降级
秒级唤醒：APP精准唤醒、通话界面可靠拉起
CallKit集成：系统级通话体验

【核心功能层】
1v1音视频：音频通话、视频通话、多态来电提醒
群组通话：多人语音/视频、添加成员、群语音/群视频
通话辅助：静音/开关摄像头、前后台切换保持、异常自动处理

【AI智能中台】
实时交互优化：AI降噪、音视频超分、实时美颜
跨场景能力：实时字幕、语音翻译
辅助智能：会议摘要、关键事项提取
业务型智能：智能语音客服（仅业务场景）

【调度层】
房间管理：通话房间创建、加入、离开
媒体协商：SDP协商、编解码协商
资源调度：分布式部署、智能路由

【传输层】
自研RTC引擎（替换声网）：Demo可评估→可用性打底→可控替换→商业化承载→平台化拓展
协议栈：WebRTC、RTP、RTCP、SRTP
网络优化：QoS策略、动态码率、FEC前向纠错

技术栈：WebRTC, 自研RTC引擎, Node.js, Python, 音视频编解码, AI语音/视觉模型`,
                axureUrl: "https://codesign.qq.com/s/627363398067674",
                designUrl: "",
                createdAt: "2024.12 - 2025.03"
            };

            // 查找Phiz Call项目
            let index = -1;
            for (let i = 0; i < projects.length; i++) {
                if (projects[i].name.includes('Phiz Call')) {
                    index = i;
                    log(`✅ 找到Phiz Call项目，位置: ${i}`);
                    log(`  名称: "${projects[i].name}"`);
                    break;
                }
            }

            if (index < 0) {
                log('❌ 未找到 Phiz Call 项目');
                log('💡 当前项目列表:');
                projects.forEach((p, i) => log(`  ${i}: "${p.name}"`));
                alert('未找到 Phiz Call 项目');
                return;
            }

            // 更新数据
            log('✅ 开始更新数据...');
            projects[index] = newPhizCall;

            // 保存
            const newData = JSON.stringify(projects);
            localStorage.setItem('pmPortfolioProjects', newData);
            log(`✅ 已保存到 localStorage，大小: ${newData.length} 字符`);

            // 验证
            const verify = localStorage.getItem('pmPortfolioProjects');
            const verifyProjects = JSON.parse(verify);
            if (verifyProjects[index].painPoints.includes('收不到推送通知')) {
                log('✅ 验证成功：painPoints 已更新');
            } else {
                log('⚠️ 验证失败：painPoints 未正确更新');
            }

            log('✅ 更新完成！');
            alert('Phiz Call 项目已更新！\n\n请刷新 index.html 页面查看效果。\n提示：在同一个浏览器标签页中刷新即可。');
        }

        function clearData() {
            if (!confirm('确定要清空所有项目数据吗？这将重置为初始状态。')) return;
            localStorage.removeItem('pmPortfolioProjects');
            log('✅ 已清空 pmPortfolioProjects');
            alert('已清空数据，请刷新 index.html 页面');
        }

        // 页面加载时自动检查
        window.onload = function() {
            checkLocalStorage();
        };
    </script>
</body>
</html>
